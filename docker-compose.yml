services:
  web:
    build:
      context: .
      dockerfile: src/Msgifly.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Database=Msgifly;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD}
    depends_on:
      - db
    ports:
      - "8080"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - msgifly-db-data:/var/opt/mssql

volumes:
  msgifly-db-data:
